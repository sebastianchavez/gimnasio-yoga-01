<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión · ZenFit Studio</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com" rel="preconnect" />
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: { colors: {
        primary: '#7ba05b', 'primary-light': '#a8c98e', 'primary-dark': '#5d7f43',
        'background-dark': '#0f1410', 'background-card': '#18211b', 'background-section': '#131a14',
        gold: '#d4af6a', sage: '#9eb38a', border: '#2a3a2a'
      }, fontFamily: { display: ['Playfair Display'], sans: ['Inter'] }}}
    }
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body data-page="login" class="bg-background-dark text-gray-200 font-sans antialiased">
  <div id="appHeader"></div>

  <main class="auth-container">
    <div class="container mx-auto px-4 sm:px-6 lg:px-8">
      <div class="max-w-md mx-auto">
        <div class="text-center mb-8 fade-in">
          <div class="h-20 w-20 rounded-full bg-primary/15 border-2 border-primary/40 flex items-center justify-center mx-auto mb-5">
            <svg class="h-10 w-10 text-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 3c-1.5 0-3 .5-4 1.5C7 5.5 6 7 6 9c0 1 .3 2 .8 3l-1.5 2c-.4.5-.3 1.3.3 1.7l.7.4c.5.3 1.2.2 1.6-.3l1.5-1.7c.6.3 1.4.5 2.1.5v.4c0 .8.7 1.5 1.5 1.5s1.5-.7 1.5-1.5V15c.7 0 1.5-.2 2.1-.5l1.5 1.7c.4.5 1.1.6 1.6.3l.7-.4c.6-.4.7-1.2.3-1.7l-1.5-2c.5-1 .8-2 .8-3 0-2-1-3.5-2-4.5-1-1-2.5-1.5-4-1.5z"></path></svg>
          </div>
          <h1 class="text-3xl font-display font-bold text-white mb-2">Bienvenido de vuelta</h1>
          <p class="text-gray-400">Inicia sesión para reservar tus clases</p>
        </div>

        <div class="bg-background-card border border-border rounded-xl p-8">
          <form id="loginForm" class="space-y-5">
            <div>
              <label class="block text-sm font-semibold text-gray-300 mb-1">Email</label>
              <input type="email" id="loginEmail" required class="w-full rounded-lg px-4 py-3" placeholder="tu@email.com"/>
            </div>
            <div>
              <label class="block text-sm font-semibold text-gray-300 mb-1">Contraseña</label>
              <input type="password" id="loginPassword" required class="w-full rounded-lg px-4 py-3" placeholder="••••••••"/>
            </div>
            <div class="flex items-center justify-between">
              <label class="flex items-center gap-2 cursor-pointer">
                <input type="checkbox" id="rememberMe" class="rounded border-border bg-background-dark"/>
                <span class="text-sm text-gray-300">Recordarme</span>
              </label>
              <a href="recuperar-password.html" class="text-primary text-sm hover:underline">¿Olvidaste tu contraseña?</a>
            </div>
            <button type="submit" class="btn-primary w-full py-4">
              <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path></svg>
              Iniciar sesión
            </button>
          </form>

          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-border"></div></div>
            <div class="relative flex justify-center text-sm"><span class="px-2 bg-background-card text-gray-400">o continúa con</span></div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <button type="button" class="btn-outline text-sm">
              <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
              Google
            </button>
            <button type="button" class="btn-outline text-sm">
              <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.991 3.657 6.659 5.604 2.872-.396-.881-1.604-2.872-2-2.872H2c0-5.523 4.477-10 10-10s10 4.477 10 10c0 4.103-2.467 7.626-6 9.165V14H10v-4h8v3.099c1.685-.832 3-2.301 3-4.099 0-2.761-2.239-5-5-5s-5 2.239-5 5h2c0-1.657 1.343-3 3-3s3 1.343 3 3-1.343 3-3 3v4c3.866 0 7-3.134 7-7 0-3.866-3.134-7-7-7s-7 3.134-7 7h2c0-2.761 2.239-5 5-5z"/></svg>
              Facebook
            </button>
          </div>

          <p class="text-center text-gray-400 text-sm mt-6">
            ¿Aún no tienes cuenta? <a href="registro.html" class="text-primary font-semibold hover:underline">Regístrate</a>
          </p>
        </div>

        <div class="bg-primary/10 border border-primary/30 rounded-xl p-4 mt-6 text-center">
          <p class="text-primary text-xs uppercase tracking-wider font-semibold mb-2">Cuentas demo</p>
          <p class="text-gray-300 text-xs mb-1"><strong class="text-white">ana@yoga.com</strong> · 123456</p>
          <p class="text-gray-300 text-xs"><strong class="text-white">carlos@gym.com</strong> · 123456</p>
        </div>
      </div>
    </div>
  </main>

  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLogged()) { location.href = 'perfil.html'; return; }
      document.getElementById('loginForm').addEventListener('submit', e => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value.trim();
        const pass = document.getElementById('loginPassword').value;
        const remember = document.getElementById('rememberMe').checked;
        const res = Auth.login(email, pass, remember);
        if (!res.ok) { UI.toast(res.error, 'error'); return; }
        UI.toast('¡Bienvenido ' + res.user.nombre.split(' ')[0] + '!');
        setTimeout(() => location.href = 'perfil.html', 800);
      });
    });
  </script>
</body>
</html>
